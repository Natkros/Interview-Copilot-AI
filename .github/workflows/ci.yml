name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q
      - name: Benchmark (offline composer)
        run: python -m app.evaluation.benchmark --out evaluation_reports
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: backend/evaluation_reports/

  backend-postgres:
    # Run migrations and the API test-suite against real PostgreSQL + Qdrant
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interviewos
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: interviewos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U interviewos" --health-interval 5s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports: ["6333:6333"]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://interviewos:ci@localhost:5432/interviewos
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic check
      - run: python scripts/smoke_postgres.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

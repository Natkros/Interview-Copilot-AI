[project]
name = "interviewos-backend"
version = "0.1.0"
description = "InterviewOS AI - resume-grounded interview copilot backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "anthropic>=0.40",
    "websockets>=13.0",
    "qdrant-client>=1.12",
    "numpy>=1.26",
    "redis>=5.0",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "python-multipart>=0.0.18",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "pdf2image>=1.17"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "reportlab>=4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.evaluation" = ["*.json"]
"app.rag" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "E741"]

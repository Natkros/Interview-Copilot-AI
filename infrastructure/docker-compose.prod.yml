# Production overlay. Run from the repository root:
#   docker compose -f docker-compose.yml -f infrastructure/docker-compose.prod.yml up -d --build
# Requires a filled-in .env (see .env.example: ENVIRONMENT=production, AUTH_SECRET,
# COOKIE_SECURE=true, POSTGRES_PASSWORD, QDRANT_API_KEY, CORS_ORIGINS, provider keys)
# and TLS certificates in infrastructure/certs/.

services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  qdrant:
    ports: !reset []
    restart: unless-stopped

  redis:
    restart: unless-stopped

  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1",
              "--proxy-headers", "--forwarded-allow-ips", "*"]

  frontend:
    ports: !reset []
    restart: unless-stopped
    build:
      args:
        # same-origin WebSocket through nginx
        NEXT_PUBLIC_WS_URL: ""

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    volumes:
      # paths resolve from the project directory (repository root)
      - ./infrastructure/nginx/interviewos.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
